<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Soknan Koum</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages has no server, so it serves this file for any URL it
      // doesn't recognize as a real file (e.g. /projects/bank-marketing).
      // This redirects back to index.html while encoding the intended path
      // in the query string, so index.html can restore it and let React
      // Router take over. pathSegmentsToKeep is 0 because this site is
      // served from the domain root (a user/org GitHub Pages site), not a
      // /repo-name/ subpath.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
